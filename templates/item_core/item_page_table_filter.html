<!-- Filters container -->
<div class="filters-container mb-4">
    <div class="row">

        <!-- Основные фильтры -->
        <div class="col-md-12">
            <button class="btn btn-primary mb-3" type="button" data-toggle="collapse" data-target="#mainFilters">
                <i class="fas fa-filter"></i> Основные фильтры
            </button>
            <button class="btn btn-secondary mb-3 ml-2" type="button" data-toggle="collapse" data-target="#advancedFilters">
                <i class="fas fa-sliders-h"></i> Расширенные фильтры
            </button>
            <button class="btn btn-info mb-3 ml-2" id="resetFilters">
                <i class="fas fa-sync"></i> Сбросить фильтры
            </button>
            <button class="theme-toggle" id="theme-toggle">
                <i class="fas fa-moon"></i>
            </button>
            <select id="perPageSelect" class="form-control same-width-as-reset"></select>
        </div>

        <!-- Поиск -->
        <div class="col-md-12 mb-3">
            <div class="search-container position-relative">
                <div class="input-group">
                    <input type="text" 
                        class="form-control" 
                        id="itemSearch" 
                        placeholder="🔍 Поиск по ID или названию предмета..."

                        <button class="btn btn-outline-secondary" type="button" id="clearSearch">
                            <i class="fas fa-times"></i>

                    </div>
                </div>

                    style="display: none; z-index: 1000; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>

        <!-- Основные фильтры -->
        <div class="col-12 collapse" id="mainFilters">
            <div class="card card-body mb-3">
                <div class="row">
                    <!-- Тип предмета -->
                    <div class="col-md-3 mb-2">
                        <label for="typeFilter">Тип предмета:</label>
                        <select class="form-control" id="typeFilter">
                            <option value="">Все</option>
                            <option value="0">Ничего</option>
                            <option value="1">Оружие Ближнего Боя</option>
                            <option value="2">Щит, Браслет</option>
                            <option value="3">Доспех</option>
                            <option value="4">Кольцо</option>
                            <option value="5">Ожерелье</option>
                            <option value="6">Ботинки</option>
                            <option value="7">Перчатки</option>
                            <option value="8">Шлем</option>
                            <option value="9">Ремень</option>
                            <option value="10">Зелья</option>
                            <option value="11">SpecificProcItem/Shop Item</option>
                            <option value="12">Книга</option>
                            <option value="13">Жезл, Фейерверк, Петарда, Свиток Облика</option>
                            <option value="14">Премет со Skill</option>
                            <option value="15">Сундук, Аналогия сундука</option>
                            <option value="16">Пустышка, Печати, Квестовый</option>
                            <option value="17">Плащ</option>
                            <option value="18">Оружие Дальнего Боя</option>
                            <option value="19">Патроны, стрелы, камни</option>
                            <option value="20">Алебарда/Копье</option>
                            <option value="21">Зелья/Package</option>
                            <option value="22">Сфера Мастера</option>
                            <option value="23">Сфера Души</option>
                            <option value="24">Сфера Защиты</option>
                            <option value="25">Сфера Разрушения</option>
                            <option value="26">Сфера Жизни</option>
                            <option value="27">Сфера 1 Слот</option>
                            <option value="28">Сфера 2 Слот</option>
                            <option value="29">Сфера 3 Слот</option>
                            <option value="30">Монеты из мешочка</option>
                            <option value="31">Трофей</option>
                            <option value="32">Мешочек монет</option>
                            <option value="33">Улучшение Питомца</option>

                            <option value="36">Зелье Доверия Питомца</option>
                            <option value="37">Коллекционная Карта</option>

                            <option value="39">Временный Сундук</option>

                        </select>
                    </div>

                    <!-- Уровень -->
                    <div class="col-md-3 mb-2">
                        <label>Уровень предмета:</label>

                            <input type="number" class="form-control" id="levelMin" placeholder="Мин">
                            <div class="input-group-prepend input-group-append">

                    <!-- Вес -->
                    <div class="col-md-3 mb-2">
                        <label>Вес предмета:</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="weightMin" placeholder="Мин">
                            <div class="input-group-prepend input-group-append">
                                <span class="input-group-text">-</span>
                            </div>
                            <input type="number" class="form-control" id="weightMax" placeholder="Макс">
                        </div>
                    </div>

                    <!-- Стакается -->
                    <div class="col-md-3 mb-2">
                        <label for="stackableFilter">Стакается:</label>
                        <select class="form-control" id="stackableFilter">
                            <option value="">Все</option>
                            <option value="1">Да</option>
                            <option value="0">Нет</option>
                        </select>
                    </div>

                    <!-- Срок действия (дни) -->
                    <div class="col-md-3 mb-2">
                        <label>Срок действия (дни):</label>

                            <input type="number" class="form-control" id="validityDaysMin" placeholder="Мин">

                        </div>
                    </div>

                    <!-- Срок действия (минуты) -->
                    <div class="col-md-3 mb-2">
                        <label>Срок действия (минуты):</label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="validityMinutesMin" placeholder="Мин">
                            <div class="input-group-prepend input-group-append">
                                <span class="input-group-text">-</span>
                            </div>
                            <input type="number" class="form-control" id="validityMinutesMax" placeholder="Макс">
                        </div>
                    </div>

                    <!-- Номер квеста -->
                    <div class="col-md-3 mb-2">
                        <label>Номер квеста:</label>
                        <input type="number" class="form-control" id="questNoFilter" placeholder="Номер квеста">
                    </div>
                </div>

                <div class="row mt-3">
                    <!-- Чекбоксы -->
                    <div class="col-md-12 text-center">
                        <div class="custom-control custom-checkbox custom-control-inline">
                            <input type="checkbox" class="custom-control-input" id="eventItemFilter">
                            <label class="custom-control-label" for="eventItemFilter">
                                <i class="fas fa-calendar-alt"></i> Ивентовый предмет
                            </label>
                        </div>
                        <div class="custom-control custom-checkbox custom-control-inline">
                            <input type="checkbox" class="custom-control-input" id="testItemFilter">
                            <label class="custom-control-label" for="testItemFilter">
                                <i class="fas fa-vial"></i> Тестовый предмет
                            </label>
                        </div>
                        <div class="custom-control custom-checkbox custom-control-inline">
                            <input type="checkbox" class="custom-control-input" id="indictFilter">
                            <label class="custom-control-label" for="indictFilter">
                                <i class="fas fa-lock"></i> Запрет на выброс
                            </label>
                        </div>
                        <div class="custom-control custom-checkbox custom-control-inline">
                            <input type="checkbox" class="custom-control-input" id="chargeFilter">
                            <label class="custom-control-label" for="chargeFilter">
                                <i class="fas fa-gem"></i> Премиум предмет
                            </label>
                        </div>
                        <div class="custom-control custom-checkbox custom-control-inline">
                            <input type="checkbox" class="custom-control-input" id="partyDropFilter">
                            <label class="custom-control-label" for="partyDropFilter">
                                <i class="fas fa-users"></i> Выпадает группе
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Расширенные фильтры -->
        <div class="col-12 collapse" id="advancedFilters">
            <div class="card card-body">
                <div class="row">
                    <div class="col-12">
                        <div class="advanced-filters-grid">
                            <!-- Здесь будут динамически добавляться фильтры для всех колонок -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="totalCount" class="mb-3 mt-3">Найдено предметов: 0</div>
<div class="pagination-container mb-4 d-flex justify-content-center gap-2"></div>

<!-- Loading overlay and messages -->
<div id="loadingOverlay" class="loading-overlay">
    <div class="loading-content">
        <div class="spinner"></div>
        <span>Загрузка данных...</span>
    </div>
</div>
<div id="errorMessage" class="message-container error-message"></div>



<!-- ГЛАВНЫЕ СКРИПТЫ ФИЛЬТРА -->
<script>
    // Type mappings для разных маршрутов
    const TYPE_MAPPINGS = {
        '/weapon': [1, 18, 20],
        '/armor': [3],
        '/gloves': [7],
        '/boots': [6],
        '/helmet': [8],
        '/shield': [2],
        '/arrows': [19],
        '/cloak': [17],
        '/materials': [10, 16],
        '/ring': [4],
        '/belt': [9],
        '/necklace': [5],
        '/earrings': [42],
        '/books': [12],
        '/potions': [10],
        '/etc': [14, 16, 13, 11],
        '/sphere': [22, 23, 24, 25, 26, 27, 28, 29],
        '/quest': [] // Quest items use special handling
    };

    // Описания типов предметов
    const TYPE_DESCRIPTIONS = {
        1: 'Оружие Ближнего Боя',
        2: 'Щит, Браслет',
        3: 'Доспех',
        4: 'Кольцо',
        5: 'Ожерелье',
        6: 'Ботинки',
        7: 'Перчатки',
        8: 'Шлем',
        9: 'Ремень',
        10: 'Зелья',
        11: 'SpecificProcItem/Shop Item',
        12: 'Книга',
        13: 'Жезл, Фейерверк, Петарда',
        14: 'Предмет со Skill',
        15: 'Сундук',
        16: 'Пустышка, Печати, Квестовый',
        17: 'Плащ',
        18: 'Оружие Дальнего Боя',
        19: 'Патроны, стрелы, камни',
        20: 'Алебарда/Копье',
        22: 'Сфера Мастера',
        23: 'Сфера Души',
        24: 'Сфера Защиты',
        25: 'Сфера Разрушения',
        26: 'Сфера Жизни',
        27: 'Сфера 1 Слот',
        28: 'Сфера 2 Слот',
        29: 'Сфера 3 Слот',
        42: 'Серьги'
    };

    // Описания расширенных фильтров
    const ADVANCED_FILTERS = [
        { id: 'IDHIT', label: 'Точность в ближнем бою', icon: '🎯', type: 'range' },
        { id: 'IDDD', label: 'Урон в ближнем бою', icon: '⚔️', type: 'range' },
        { id: 'IRHIT', label: 'Точность в дальнем бою', icon: '🏹', type: 'range' },
        { id: 'IRDD', label: 'Урон в дальнем бою', icon: '🎯', type: 'range' },
        { id: 'IMHIT', label: 'Магическая точность', icon: '✨', type: 'range' },
        { id: 'IMDD', label: 'Магический урон', icon: '🔮', type: 'range' },
        { id: 'IHPPlus', label: 'Доп. HP', icon: '❤️', type: 'range' },
        { id: 'IMPPlus', label: 'Доп. MP', icon: '💧', type: 'range' },
        { id: 'ISTR', label: 'Сила', icon: '💪', type: 'range' },
        { id: 'IDEX', label: 'Ловкость', icon: '🏃', type: 'range' },
        { id: 'IINT', label: 'Интеллект', icon: '🧠', type: 'range' },
        { id: 'IHPRegen', label: 'Реген HP', icon: '♥️', type: 'range' },
        { id: 'IMPRegen', label: 'Реген MP', icon: '💫', type: 'range' },
        { id: 'IAttackRate', label: 'Скорость атаки', icon: '⚡', type: 'range' },
        { id: 'IMoveRate', label: 'Скорость передвижения', icon: '🏃', type: 'range' },
        { id: 'ICritical', label: 'Шанс крита', icon: '🎯', type: 'range' }
    ];

    // Глобальные переменные
    let debounceTimer;
    let lastRequest = null;
    let currentPage = 1;
    let cachedData = null;
    

    // Элементы для отображения загрузки и ошибок
    const loadingMessage = document.getElementById('loadingMessage');
    const errorMessage = document.getElementById('errorMessage');

    // Инициализация при загрузке DOM
    document.addEventListener('DOMContentLoaded', function() {
        initialize();
    });


    async function fetchData(forceReload = false) {
        if (cachedData && !forceReload) {
            return cachedData;
        }

        // Показать индикатор загрузки
        toggleLoadingState(true);

        try {
            const response = await fetch(`${window.location.pathname}?all=1&page=1`, {
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            });

            if (!response.ok) throw new Error('Network response was not ok');

            const data = await response.json();
            if (data.error) {
                throw new Error(`Error: ${data.error}`);
            }

            const totalPages = data.pages;
            let allItems = [...data.items];

            // Загружаем все страницы
            for (let page = 2; page <= totalPages; page++) {
                const pageResponse = await fetch(`${window.location.pathname}?all=1&page=${page}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                });
                const pageData = await pageResponse.json();
                if (pageData.items) {
                    allItems = allItems.concat(pageData.items);
                }
            }

            // Сохраняем данные в кэше
            cachedData = { ...data, items: allItems };

            // Скрыть индикатор загрузки
            toggleLoadingState(false);

            return cachedData;
        } catch (error) {
            // Показываем сообщение об ошибке
            toggleLoadingState(false);
            showError(error.message);
            return null;
        }
    }


    // Обновленная функция toggleLoadingState
    function toggleLoadingState(isLoading) {
        const loadingOverlay = document.getElementById('loadingOverlay');
        const errorMessage = document.getElementById('errorMessage');
        
        if (isLoading) {
            loadingOverlay.classList.add('show');
            errorMessage?.classList.remove('show');
        } else {
            setTimeout(() => {
                loadingOverlay.classList.remove('show');
            }, 500);
        }
    }

    // Обновленная функция showError
    function showError(message) {
        const errorMessage = document.getElementById('errorMessage');
        if (errorMessage) {
            errorMessage.textContent = `Произошла ошибка: ${message}`;
            errorMessage.classList.add('show');
            
            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
    }

    // Добавляем анимации к существующей функции renderItems
    const originalRenderItems = window.renderItems;
    window.renderItems = function(items, resources) {
        if (!items) return;
        
        const tableBody = document.querySelector('table tbody');
        if (!tableBody) return;
        
        // Применяем эффект затухания
        tableBody.classList.add('table-fade-enter');
        
        // Вызываем оригинальную функцию
        originalRenderItems(items, resources);
        
        // Запускаем анимацию появления
        requestAnimationFrame(() => {
            tableBody.classList.remove('table-fade-enter');
            tableBody.classList.add('table-fade-enter-active');
            
            setTimeout(() => {
                tableBody.classList.remove('table-fade-enter-active');
            }, 300);
        });
    }

    // Добавляем анимации к существующей функции createPagination
    const originalCreatePagination = window.createPagination;
    window.createPagination = function(total, currentPage, perPage) {
        const paginationContainer = document.querySelector('.pagination-container');
        if (!paginationContainer) return;
        
        // Скрываем пагинацию перед обновлением
        paginationContainer.style.opacity = '0';
        
        // Вызываем оригинальную функцию
        originalCreatePagination(total, currentPage, perPage);
        
        // Плавно показываем обновленную пагинацию
        requestAnimationFrame(() => {
            paginationContainer.style.opacity = '1';
        });
    }

    // Инициализация при загрузке страницы
    document.addEventListener('DOMContentLoaded', () => {
        // Добавляем обработчики для анимации кнопок пагинации
        document.querySelector('.pagination-container')?.addEventListener('click', (e) => {
            if (e.target.matches('button')) {
                e.target.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    e.target.style.transform = '';
                }, 200);
            }
        });
    });

    // Основная функция инициализации
    async function initialize() {
        const data = await fetchData();
        if (!data) return;
        window.data = data;
        initializeTypeFilter();
        initializeAdvancedFilters();

        // Обработчик всех фильтров
        document.querySelector('.filters-container').addEventListener('input', event => {
            if (event.target.classList.contains('form-control') || 
                event.target.classList.contains('custom-control-input')) {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => applyFilters(data, 1), 300);
            }
        });

        // Сброс фильтров
        document.getElementById('resetFilters')?.addEventListener('click', () => {
            document.querySelectorAll('.form-control, .custom-control-input').forEach(input => {
                if (input.type === 'checkbox') {
                    input.checked = false;
                } else if (input.id !== 'perPageSelect') {
                    input.value = '';
                }
            });
            applyFilters(data, 1);
        });

        // Выбор количества элементов на странице
        document.getElementById('perPageSelect')?.addEventListener('change', () => {
            applyFilters(data, 1);
        });

        // Начальная загрузка
        applyFilters(data, 1);
    }

    // Инициализация фильтра типов
    function initializeTypeFilter() {
        const typeFilter = document.getElementById('typeFilter');
        if (!typeFilter) return;

        const allowedTypes = getAllowedTypes();
        
        // Очищаем существующие опции
        typeFilter.innerHTML = '<option value="">Все</option>';

        // Добавляем только разрешенные типы
        allowedTypes.forEach(type => {
            const option = document.createElement('option');
            option.value = type;
            option.textContent = TYPE_DESCRIPTIONS[type] || `Тип ${type}`;
            typeFilter.appendChild(option);
        });


        const perPageSelect = document.getElementById('perPageSelect');
        if (!perPageSelect) return;

        // Определяем доступные варианты количества элементов на странице
        const perPageOptions = [10, 25, 50, 75, 100, 150, 200];

        // Очищаем существующие опции
        perPageSelect.innerHTML = '';

        // Добавляем новые опции
        perPageOptions.forEach(option => {
            const optionElement = document.createElement('option');
            optionElement.value = option;
            optionElement.textContent = `${option} на странице`;
            perPageSelect.appendChild(optionElement);
        });

        // Устанавливаем значение по умолчанию (25)
        perPageSelect.value = '25';

        // Устанавливаем начальное значение из URL
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('per_page')) {
            const urlPerPage = urlParams.get('per_page');
            if (perPageOptions.includes(Number(urlPerPage))) {
                perPageSelect.value = urlPerPage;
            }
        }
    }

    // Получение разрешенных типов для текущей страницы
    function getAllowedTypes() {
        const path = window.location.pathname;
        return TYPE_MAPPINGS[path] || [];
    }

    // Инициализация расширенных фильтров
    function initializeAdvancedFilters() {
        const container = document.querySelector('.advanced-filters-grid');
        if (!container) return;

        const filterCards = ADVANCED_FILTERS.map(filter => `
            <div class="filter-card" data-filter="${filter.id}">
                <div class="filter-card-header">
                    <span class="filter-icon">${filter.icon}</span>
                    <span class="filter-label">${filter.label}</span>
                </div>
                <div class="filter-inputs">
                    <div class="input-group">
                        <input type="number" 
                            class="form-control" 
                            id="${filter.id}Min"
                            placeholder="Мин" 
                            step="any">
                        <div class="input-group-text">-</div>
                        <input type="number" 
                            class="form-control" 
                            id="${filter.id}Max"
                            placeholder="Макс" 
                            step="any">
                    </div>
                </div>
            </div>
        `).join('');

        container.innerHTML = filterCards;
    }

    // Применение фильтров
    function applyFilters(data, page = 1) {
        const tableBody = document.querySelector('table tbody');
        if (!tableBody) return;

        // Собираем все фильтры
        const filters = {};
        
        document.querySelectorAll('.form-control, .custom-control-input').forEach(input => {
            if (input.id === 'perPageSelect') return;
            if ((input.type === 'checkbox' && input.checked) || 
                (input.type !== 'checkbox' && input.value)) {
                filters[input.id] = input.type === 'checkbox' ? '1' : input.value;
            }
        });

        // Применяем фильтры к данным
        let filteredData = data.items;
        
        // Фильтрация по типу
        if (filters.typeFilter) {
            filteredData = filteredData.filter(item => item.IType === Number(filters.typeFilter));
        }


        // Применение фильтра для уровня
        if (filters.levelMin || filters.levelMax) {
            filteredData = filteredData.filter(item => {
                const level = item.ILevel || 0;
                return (!filters.levelMin || level >= Number(filters.levelMin)) &&
                    (!filters.levelMax || level <= Number(filters.levelMax));
            });
        }

        // Применение фильтра для веса
        if (filters.weightMin || filters.weightMax) {
            filteredData = filteredData.filter(item => {
                const weight = item.IWeight || 0;
                return (!filters.weightMin || weight >= Number(filters.weightMin)) &&
                    (!filters.weightMax || weight <= Number(filters.weightMax));
            });
        }

        // Фильтрация по стакаемости
        if (filters.stackableFilter) {
            filteredData = filteredData.filter(item => item.IMaxStack === Number(filters.stackableFilter));
        }

        // Фильтрация по сроку действия в днях
        if (filters.validityDaysMin || filters.validityDaysMax) {
            filteredData = filteredData.filter(item => {
                const validityDays = item.ITermOfValidity || 0;
                return (!filters.validityDaysMin || validityDays >= Number(filters.validityDaysMin)) && 
                    (!filters.validityDaysMax || validityDays <= Number(filters.validityDaysMax));
            });
        }

        // Фильтрация по сроку действия в минутах
        if (filters.validityMinutesMin || filters.validityMinutesMax) {
            filteredData = filteredData.filter(item => {
                const validityMinutes = item.ITermOfValidityMi || 0;
                return (!filters.validityMinutesMin || validityMinutes >= Number(filters.validityMinutesMin)) && 
                    (!filters.validityMinutesMax || validityMinutes <= Number(filters.validityMinutesMax));
            });
        }


        // Фильтрация по номеру квеста
        if (filters.questNoFilter) {
            filteredData = filteredData.filter(item => item.IQuestNo === Number(filters.questNoFilter));
        }

        // Фильтрация по чекбоксам
        if (filters.eventItemFilter) {
            filteredData = filteredData.filter(item => item.IIsEvent === true);
        }
        if (filters.testItemFilter) {
            filteredData = filteredData.filter(item => item.IIsTest === true);
        }
        if (filters.indictFilter) {
            filteredData = filteredData.filter(item => item.IIsIndict === true);
        }
        if (filters.chargeFilter) {
            filteredData = filteredData.filter(item => item.IIsCharge === true);
        }
        if (filters.partyDropFilter) {
            filteredData = filteredData.filter(item => item.IIsPartyDrop === true);
        }

        // Обновляем общее количество отфильтрованных предметов (до пагинации)
        updateTotalCount(filteredData.length);

        // Пагинация
        const perPage = Number(document.getElementById('perPageSelect')?.value) || 25;
        const startIndex = (page - 1) * perPage;
        const endIndex = startIndex + perPage;
        const paginatedData = filteredData.slice(startIndex, endIndex);

        renderItems(paginatedData, data.resources);
        createPagination(filteredData.length, page, perPage);
        updateURL(filters);

        currentPage = page;
    }


    // Отрисовка предметов
    function renderItems(items, resources) {
        const tableBody = document.querySelector('table tbody');
        const fallbackImage = 'https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/no_monster/no_monster_image.png';

        if (!tableBody) return;

        const itemsHTML_table_headers = '{% block table_headers %}\n\t<th>🖼️</th>\n\t<th>Название</th>\n\t<th>Описание</th>\n\t<th>Вес</th>\n\t<th>Класс</th>\n{% endblock %}'

        const itemsHTML = items.map(item => `
            <tr>
                <td>
                    <div class="hover-text-wrapper">
                        <a href="/item/${item.IID}">
                            <img src="${resources[item.IID] || fallbackImage}"
                                alt="${item.IName}"
                                title="${item.IName}"
                                width="48"
                                height="48"
                                loading="lazy"
                                class="item-image">
                        </a>
                        <div class="hover-text">[${item.IID}] ${item.IName}</div>
                    </div>
                </td>
                <td>
                    <div class="item-name">
                        <a href="/item/${item.IID}">${item.IName}</a>
                    </div>
                </td>
                <td class="item-desc">${item.IDesc || 'Нет описания'}</td>
                <td>${item.IWeight || 'N/A'}</td>
                <td><img src="${item.IUseClass || 'N/A'}" alt="${item.IName}"></td>
            </tr>
        `).join('');
    
        tableBody.innerHTML = itemsHTML_table_headers + itemsHTML;
    }

    // Создание пагинации
    function createPagination(total, currentPage, perPage) {
        const paginationContainer = document.querySelector('.pagination-container');
        if (!paginationContainer) return;
    
        const totalPages = Math.ceil(total / perPage);
        let paginationHTML = [];

        // Кнопка "Предыдущая"
        paginationHTML.push(`
            <button class="btn btn-secondary ${currentPage === 1 ? 'disabled' : ''}"
                    onclick="applyFilters(data, ${currentPage - 1})"
                    ${currentPage === 1 ? 'disabled' : ''}>
                Предыдущая
            </button>
        `);
    
        // Номера страниц
        for (let i = 1; i <= totalPages; i++) {
            if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                paginationHTML.push(`
                    <button class="btn ${i === currentPage ? 'btn-primary' : 'btn-secondary'}"
                            onclick="applyFilters(data, ${i})">
                        ${i}
                    </button>
                `);
            } else if (i === currentPage - 3 || i === currentPage + 3) {
                paginationHTML.push('<span class="pagination-ellipsis">...</span>');
            }
        }
    
        // Кнопка "Следующая"
        paginationHTML.push(`
            <button class="btn btn-secondary ${currentPage === totalPages ? 'disabled' : ''}"
                    onclick="applyFilters(data, ${currentPage + 1})"
                    ${currentPage === totalPages ? 'disabled' : ''}>
                Следующая
            </button>
        `);
    
        paginationContainer.innerHTML = paginationHTML.join('');
    }

    // Обновление URL
    function updateURL(params) {

        const url = new URL(window.location.href);
        const searchParams = new URLSearchParams(params); // Создаем URLSearchParams из объекта params
        url.search = searchParams.toString(); // Преобразуем параметры в строку формата key=value
        history.pushState({}, '', url);
        console.log(url.toString()); // Выводим обновленный URL в консоль
    }


    // Обновление счетчика предметов
    function updateTotalCount(count) {
        const totalCount = document.getElementById('totalCount');
        if (totalCount) {
            totalCount.textContent = `Найдено предметов: ${count}`;
        }
    }
    
    // Глобальная функция смены страницы
    window.changePage = function(page) {
        applyFilters(page);
    };

</script>
