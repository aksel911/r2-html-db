<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2 Model Viewer - Optimized</title>
    <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
            position: relative;
            background-color: transparent;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .container.hidden {
            display: none;
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            flex-direction: row;
            align-items: center;
            transition: opacity 0.3s ease, visibility 0.3s ease; /* Smooth transition */
            visibility: visible; /* Initially visible */
            opacity: 1; /* Initially visible */
        }

        .controls.hidden {
            opacity: 0; /* Fade out */
            visibility: hidden; /* Make non-interactive */
        }

        .toggle-menu {
            position: absolute;
            top: 110px; /* Position the button at the bottom */
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 16px;
            cursor: pointer;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease; /* Smooth transition for opacity and visibility */
        }

        .toggle-menu.hidden {
            opacity: 0; /* Fade out */
            visibility: hidden; /* Ensure it's not interactive when hidden */
        }

        .animation-controls, .model-controls {
            display: flex;
            gap: 10px;
            margin: 5px 0;
        }

        button {
            padding: 8px 16px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            background: #2196F3;
            color: white;
            font-weight: bold;
            min-width: 80px;
        }

        button:hover:not(:disabled) {
            background: #1976D2;
        }

        button:disabled {
            background: #cccccc;
            cursor: not-allowed;
            opacity: 0.7;
        }

        .info {
            color: white;
            text-align: center;
            margin: 5px 0;
            font-size: 14px;
        }

        #modelInfo {
            margin-bottom: 10px;
        }

        .animation-name {
            color: #4CAF50;
            font-weight: bold;
        }



        /* GLB Container */
        .toggle-menu, .toggle-lock {
            position: absolute;
            top: 110px;
            background: rgba(0, 0, 0, 0.2);
            color: white;
            border: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 16px;
            cursor: pointer;
            z-index: 1000;
            transition: opacity 0.3s ease, visibility 0.3s ease, background 0.3s ease;
        }

        .toggle-menu {
            left: 50%;
            transform: translateX(calc(-100% - 5px));
        }

        .toggle-lock {
            left: 50%;
            transform: translateX(5px);
        }

        .toggle-menu:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        /* Стили для заблокированного состояния */
        .toggle-lock.locked {
            background: rgba(255, 0, 0, 0.2);
        }

        .toggle-lock.locked:hover {
            background: rgba(0, 255, 0, 0.4);
        }

        /* Стили для разблокированного состояния */
        .toggle-lock:not(.locked) {
            background: rgba(0, 255, 0, 0.2);
        }

        .toggle-lock:not(.locked):hover {
            background: rgba(255, 0, 0, 0.4);
        }

        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="container" id="modelContainer">
        <model-viewer
            id="modelViewer"
            camera-controls
            autoplay

            alpha-mode="blend"
            shadow-intensity="1"
            exposure="1"
            shadow-softness="0.5"
            environment-image="neutral"

            camera-orbit="180deg 75deg 105%"
            min-camera-orbit="auto auto auto"
            max-camera-orbit="auto auto 400%"

            interaction-prompt="auto"

            auto-rotate
            rotation-per-second="3deg"
            auto-rotate-delay="0"

            alt="R2 Online 3D model viewer with animation">
        </model-viewer>
        <button class="toggle-menu" onclick="toggleMenu()">☰ Show Menu</button>
        <button class="toggle-lock locked" onclick="toggleLock()">🔓 Unlock</button>
        <div class="controls hidden">
            <div class="info" id="animInfo">Loading animations...</div>
            <div class="animation-controls">
                <button id="playBtn" onclick="togglePlay()">▶️</button>
                <button id="resetBtn" onclick="resetAnimation()">🔄</button>
            </div>
            <div class="model-controls">
                <button id="prevModel" onclick="previousModel()">◀️</button>
                <button id="nextModel" onclick="nextModel()">▶️</button>
            </div>
            <div class="info" id="modelInfo">Animation: Loading...</div>
        </div>
    </div>

    <!-- Constants and Configuration -->
    <script>
        // Определение основных констант
        const animationVariants = [
            'AttackArms',
            'AttackLeg',
            'ChargeAttack',
            'Cidle',
            'Die',
            'EarthQuake',
            'FireDestroyer',
            'Regen',
            'Walk'
        ];

        const modelViewer = document.getElementById('modelViewer');
        const baseUrl = 'https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/{{ monstermodelno_result }}/{{ monstermodelno_result }}_';
        const prefix = '{{ prefix }}';
        let availableModels = [];
        let currentModelIndex = 0;
        let isPlaying = true;
        let modelCache = new Map();
    </script>

    <!-- Utilities and Helpers -->
    <script>
        // Вспомогательные функции
        async function checkFileExists(url) {
            if (modelCache.has(url)) {
                return true;
            }
            try {
                const response = await fetch(url, { method: 'HEAD' });
                const exists = response.status === 200;
                if (exists) {
                    modelCache.set(url, true);
                }
                return exists;
            } catch (e) {
                return false;
            }
        }
    </script>

    <!-- Model Search and Loading -->
    <script>
        async function loadModel(index) {
            if (index >= 0 && index < availableModels.length) {
                const model = availableModels[index];
                console.log('Loading model:', model); // Для отладки
                modelViewer.src = model.url;
                currentModelIndex = index;
                updateModelInfo();
            }
        }
    </script>


    <!-- Model GitHub Finding -->
    <script>
    async function findAvailableModels() {
        document.getElementById('modelInfo').textContent = 'Scanning for models...';
        const models = [];

        // Определяем маппинг классов
        const classMapping = {
            0: {}, // Нет класса (пустой объект)
            1: { // Рыцарь
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина'
            },
            2: { // Рейнджер
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина'
            },
            4: { // Маг
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина'
            },
            5: { // Рыцарь, Маг
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина'
            },
            7: { // Рыцарь, Рейнджер, Маг
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина'
            },
            8: { // Ассасин
                '06': 'Ассасин Мужчина',
                '07': 'Ассасин Женщина'
            },
            15: { // Рыцарь, Рейнджер, Маг, Ассасин
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина',
                '06': 'Ассасин Мужчина',
                '07': 'Ассасин Женщина'
            },
            16: { // Призыватель
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            18: { // Рейнджер, Призыватель
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            19: { // Рыцарь, Рейнджер, Призыватель
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            20: { // Маг, Призыватель
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            22: { // Рейнджер, Маг, Призыватель
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            23: { // Рыцарь, Рейнджер, Маг, Призыватель
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            },
            255: { // Все классы
                '00': 'Рыцарь Мужчина',
                '01': 'Рыцарь Женщина',
                '02': 'Рейнджер Мужчина',
                '03': 'Рейнджер Женщина',
                '04': 'Маг Мужчина',
                '05': 'Маг Женщина',
                '06': 'Ассасин Мужчина',
                '07': 'Ассасин Женщина',
                '08': 'Призыватель Мужчина',
                '09': 'Призыватель Женщина'
            }
        };

        // Функция для создания вариантов регистра
        function getCaseVariants(prefix, number) {
            const variants = [];
            const prefixCases = [prefix.toLowerCase(), prefix.toUpperCase()];

            for (const folderPrefix of prefixCases) {
                for (const filePrefix of prefixCases) {
                    variants.push({
                        folder: `${folderPrefix}${number}`,
                        file: `${filePrefix}${number}`
                    });
                }
            }
            return variants;
        }

        // Функция для проверки брони с учетом класса персонажа
        async function checkArmorModels(prefix, baseNumber, useClass) {
            const checkPromises = [];

            // Получаем список классов для проверки из маппинга
            const classesToCheck = classMapping[useClass] || {};
            console.log(`Checking armor models for class ${useClass}:`, classesToCheck);

            // Проверяем все варианты регистра префикса
            const prefixCases = [prefix.toLowerCase(), prefix.toUpperCase()];

            for (const prefixCase of prefixCases) {
                // Получаем последние 3 цифры из baseNumber
                const lastThreeDigits = baseNumber.slice(-3);

                // Проверяем только классы из маппинга
                for (const [classIndex, className] of Object.entries(classesToCheck)) {
                    // Формируем номер модели: 0X0YYY, где X - индекс класса, YYY - последние 3 цифры
                    const modelNumber = `0${classIndex[1]}0${lastThreeDigits}`;

                    // Проверяем модель
                    const folder = `${prefixCase}${modelNumber}`;
                    const file = `${prefixCase}${modelNumber}`;
                    const url = `https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/${folder}/${file}.glb`;

                    console.log(`Checking armor for ${className}:`, url);

                    checkPromises.push(
                        checkFileExists(url).then(exists => {
                            if (exists) {
                                console.log(`Found armor model for ${className}:`, url);
                                models.push({
                                    index: classIndex,
                                    variant: className,
                                    url: url
                                });
                            }
                        })
                    );
                }
            }

            await Promise.all(checkPromises);
            return models.length > 0;
        }

        // Функция для проверки моделей монстров (с анимациями)
        async function checkMonsterModel(folder, file) {
            const checkPromises = [];
            let foundModels = false;

            // Сначала проверяем варианты с постфиксами (00-35 и анимации)
            for (let i = 0; i <= 35; i++) {
                const index = i.toString().padStart(2, '0');
                const url = `https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/${folder}/${file}_${index}.glb`;

                checkPromises.push(
                    checkFileExists(url).then(exists => {
                        if (exists) {
                            console.log('Found monster model with index:', url);
                            models.push({
                                index: index,
                                variant: null,
                                url: url
                            });
                            foundModels = true;
                        }
                    })
                );
            }

            for (const variant of animationVariants) {
                const url = `https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/${folder}/${file}_${variant}.glb`;

                checkPromises.push(
                    checkFileExists(url).then(exists => {
                        if (exists) {
                            console.log('Found animation:', url);
                            models.push({
                                variant: variant,
                                url: url
                            });
                            foundModels = true;
                        }
                    })
                );
            }

            await Promise.all(checkPromises);

            // Если не нашли модели с постфиксами, проверяем базовую модель
            if (!foundModels) {
                const baseUrl = `https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/${folder}/${file}.glb`;
                const exists = await checkFileExists(baseUrl);
                if (exists) {
                    console.log('[NO ANIMATIONS FOUND!] Loading base monster model:', baseUrl);
                    models.push({
                        index: '00',
                        variant: null,
                        url: baseUrl
                    });
                    return true;
                }
            }

            return foundModels;
        }

        // Функция для проверки моделей предметов (без анимаций)
        async function checkItemModel(folder, file) {
            const url = `https://raw.githubusercontent.com/Aksel911/R2-HTML-DB/main/static/models/${folder}/${file}.glb`;
            console.log('Checking URL:', url);
            const exists = await checkFileExists(url);
            if (exists) {
                console.log('Found item model:', url);
                models.push({
                    index: '00',
                    variant: null,
                    url: url
                });
                return true;
            }
            return false;
        }

        const monsterNumber = baseUrl.match(/models\/([^\/]+)\//)[1];
        console.log('Search started for:', monsterNumber);
        const prefix = '{{ prefix }}' || '';
        const useClass = {{ use_class|default(0) }};

        if (window.location.href.includes('/monster/')) {
            // Для монстров проверяем модели и анимации
            console.log('Checking monster models with prefix:', prefix);
            const variants = getCaseVariants(prefix, monsterNumber);
            await Promise.all(
                variants.map(v => checkMonsterModel(v.folder, v.file))
            );
        } else if (prefix.toLowerCase() === 'p') {
            // Для брони проверяем варианты в зависимости от класса
            console.log('Checking armor models for class:', useClass);
            await checkArmorModels(prefix, monsterNumber, useClass);
        } else {
            // Для остальных предметов проверяем только модель
            console.log('Checking item model with prefix:', prefix);
            const variants = getCaseVariants(prefix, monsterNumber);
            await Promise.all(
                variants.map(v => checkItemModel(v.folder, v.file))
            );
        }

        console.log(`Found ${models.length} models`);
        return models.sort((a, b) => {
            if (a.index !== b.index) {
                return parseInt(a.index || '0') - parseInt(b.index || '0');
            }
            if (!a.variant) return -1;
            if (!b.variant) return 1;
            return a.variant.localeCompare(b.variant);
        });
    }
    </script>




    <!-- UI Controls and Updates -->
    <script>
        // Функции управления интерфейсом
        function updateModelInfo() {
            const currentModel = availableModels[currentModelIndex];
            const modelName = currentModel.variant
                ? `${currentModel.index}_${currentModel.variant}`
                : currentModel.index;

            document.getElementById('modelInfo').textContent =
                `File: ${modelName} (${currentModelIndex + 1}/${availableModels.length})`;

            document.getElementById('prevModel').disabled = currentModelIndex <= 0;
            document.getElementById('nextModel').disabled = currentModelIndex >= availableModels.length - 1;
        }

        function togglePlay() {
            const playBtn = document.getElementById('playBtn');
            if (isPlaying) {
                modelViewer.pause();
                playBtn.textContent = '▶️';
            } else {
                modelViewer.play();
                playBtn.textContent = '⏹️';
            }
            isPlaying = !isPlaying;
        }

        function resetAnimation() {
            modelViewer.currentTime = 0;
            modelViewer.play();
            isPlaying = true;
            document.getElementById('playBtn').textContent = '⏹️';
        }

        function previousModel() {
            if (currentModelIndex > 0) {
                loadModel(currentModelIndex - 1);
            }
        }

        function nextModel() {
            if (currentModelIndex < availableModels.length - 1) {
                loadModel(currentModelIndex + 1);
            }
        }

        function toggleMenu() {
            const controls = document.querySelector('.controls');
            const toggleBtn = document.querySelector('.toggle-menu');
            controls.classList.toggle('hidden');
            toggleBtn.textContent = controls.classList.contains('hidden') ? '☰ Show Menu' : '👁️Hide Menu';
        }
    </script>

    <!-- Event Listeners -->
    <script>
        // Обработчики событий
        modelViewer.addEventListener('load', () => {
            console.log('Model loaded');
            const animations = modelViewer.availableAnimations;
            const animationsList = animations.map(anim =>
                `<span class="animation-name">${anim}</span>`).join(', ');

            document.getElementById('animInfo').innerHTML =
                animations.length > 0 ?
                `Animation name: ${animationsList}` :
                'No animations available';
        });

        document.addEventListener('keydown', (event) => {
            switch(event.key) {
                case 'ArrowLeft':
                    previousModel();
                    break;
                case 'ArrowRight':
                    nextModel();
                    break;
                case ' ':
                    togglePlay();
                    event.preventDefault();
                    break;
                case 'Escape':
                    toggleMenu();
                    break;
            }
        });
    </script>

    <!-- Initialization -->
    <script>
        async function initialize() {
            availableModels = await findAvailableModels();
            console.log('Available models:', availableModels);

            const container = document.getElementById('modelContainer');

            if (availableModels.length > 0) {
                container.classList.remove('hidden');
                loadModel(0);
            } else {
                container.classList.add('hidden');
                console.log('No models found - hiding viewer');
            }
        }

        initialize();
    </script>

    <!-- Lock / Unlock -->
    <script>
        // Начальное состояние - заблокировано
        let isLocked = true;

        function toggleLock() {
            const lockBtn = document.querySelector('.toggle-lock');
            const modelViewer = document.getElementById('modelViewer');
            isLocked = !isLocked;

            if (isLocked) {
                lockBtn.textContent = '🔓 Unlock';
                lockBtn.classList.add('locked');
                modelViewer.style.pointerEvents = 'none';
            } else {
                lockBtn.textContent = '🔒 Lock';
                lockBtn.classList.remove('locked');
                modelViewer.style.pointerEvents = 'auto';
            }
        }

        function toggleMenu() {
            const controls = document.querySelector('.controls');
            const toggleBtn = document.querySelector('.toggle-menu');
            controls.classList.toggle('hidden');
            toggleBtn.textContent = controls.classList.contains('hidden') ? '☰ Show Menu' : '👁️ Hide Menu';
        }
    </script>
</body>
</html>
