<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Model Viewer - GitHub Version</title>
    <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            max-width: 100%;
            height: 100vh;
            margin: 0;
            padding: 0;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <model-viewer
            src="https://raw.githubusercontent.com/YOUR_USERNAME/REPO_NAME/main/src/output_models/m00091/m00091_01.glb"
            camera-controls
            auto-rotate
            shadow-intensity="1"
            exposure="1"
            shadow-softness="0.5"
            environment-image="neutral"
            camera-orbit="0deg 75deg 105%"
            min-camera-orbit="auto auto auto"
            max-camera-orbit="auto auto 400%"
            interaction-prompt="auto"
            alt="3D model viewer">
        </model-viewer>
    </div>
</body>
</html>
